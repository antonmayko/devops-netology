apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy1
  labels:
    app: deploy1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy1
  template:
    metadata:
      labels:
        app: deploy1
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
          - containerPort: 80
        volumeMounts:
          - name: config1
            mountPath: "/usr/share/nginx/html/"

      - name: multitool
        image: wbitt/network-multitool
        ports:
          - containerPort: 8080
            name: http-port
        env:
        - name: HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: confmap1
              key: multitool_port

      volumes:
      - name: config1
        configMap:
          name: confmap1
